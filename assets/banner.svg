<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" role="img" aria-label="VirtuPharm Core animated banner" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>
      /* Logo float + glow */
      @keyframes floatGlow {
        0%, 100% { transform: translateY(0); filter: drop-shadow(0 0 14px rgba(16,185,129,.55)) drop-shadow(0 0 30px rgba(52,211,153,.4)); }
        50%      { transform: translateY(-8px); filter: drop-shadow(0 0 26px rgba(16,185,129,.9)) drop-shadow(0 0 50px rgba(52,211,153,.6)); }
      }
      .logo-float { animation: floatGlow 6s ease-in-out infinite; }

      /* Logo ECG sweep */
      @keyframes logoSweep { 0% { stroke-dashoffset: 750; } 100% { stroke-dashoffset: -750; } }
      .logo-beam { stroke-dasharray: 180 570; animation: logoSweep 2.5s linear infinite; }

      @keyframes nodePing {
        0%, 100% { transform: scale(1); opacity: .5; }
        40%, 60% { transform: scale(1.5); opacity: 1; }
      }
      .node { transform-box: fill-box; transform-origin: center; animation: nodePing 2.5s ease-in-out infinite; }

      /* Banner-wide ECG sweep */
      @keyframes bannerSweep { 0% { stroke-dashoffset: 160; } 100% { stroke-dashoffset: -1000; } }
      .ecg-beam { stroke-dasharray: 160 840; animation: bannerSweep 4s linear infinite; }

      /* Text entrance */
      @keyframes slideIn { 0% { opacity: 0; transform: translateX(-30px); } 100% { opacity: 1; transform: translateX(0); } }
      .t1 { animation: slideIn 1s ease-out .1s both; }
      .t2 { animation: slideIn 1s ease-out .4s both; }
      .t3 { animation: slideIn 1s ease-out .7s both; }

      /* Shimmer on title underline */
      @keyframes shimmer { 0% { stroke-dashoffset: 600; } 100% { stroke-dashoffset: -600; } }
      .shimmer { stroke-dasharray: 120 480; animation: shimmer 3.5s linear infinite; }

      /* Rising bubbles */
      @keyframes rise {
        0%   { transform: translateY(0); opacity: 0; }
        15%  { opacity: .7; }
        100% { transform: translateY(-300px); opacity: 0; }
      }
      .b { animation: rise 7s ease-in infinite; }

      /* Blinking status dot */
      @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }
      .live { animation: blink 1.4s ease-in-out infinite; }
    </style>

    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="pulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#10b981"/>
      <stop offset=".5" stop-color="#34d399"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#10b981" stop-opacity=".1"/>
      <stop offset=".5" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity=".9"/>
    </linearGradient>
    <linearGradient id="flask" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38bdf8" stop-opacity=".8"/>
      <stop offset="1" stop-color="#0ea5e9" stop-opacity=".2"/>
    </linearGradient>
    <radialGradient id="glowL" cx=".15" cy=".4" r=".6">
      <stop offset="0" stop-color="#10b981" stop-opacity=".22"/>
      <stop offset="1" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowR" cx=".9" cy=".2" r=".5">
      <stop offset="0" stop-color="#38bdf8" stop-opacity=".18"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1e293b" stroke-width="1" opacity=".6"/>
    </pattern>
    <filter id="glow" x="-10%" y="-50%" width="120%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="round"><rect width="1200" height="440" rx="28"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <!-- Background -->
    <rect width="1200" height="440" fill="url(#bg)"/>
    <rect width="1200" height="440" fill="url(#grid)"/>
    <rect width="1200" height="440" fill="url(#glowL)"/>
    <rect width="1200" height="440" fill="url(#glowR)"/>

    <!-- Rising bubbles -->
    <g fill="none" stroke="#38bdf8" stroke-width="1.5">
      <circle class="b" cx="430"  cy="400" r="5"  style="animation-delay:0s"/>
      <circle class="b" cx="560"  cy="410" r="8"  style="animation-delay:1.4s"/>
      <circle class="b" cx="700"  cy="405" r="4"  style="animation-delay:2.6s"/>
      <circle class="b" cx="840"  cy="415" r="7"  style="animation-delay:.8s"/>
      <circle class="b" cx="980"  cy="400" r="5"  style="animation-delay:3.4s"/>
      <circle class="b" cx="1100" cy="410" r="9"  style="animation-delay:2s"/>
      <circle class="b" cx="630"  cy="420" r="3"  style="animation-delay:4.4s"/>
      <circle class="b" cx="910"  cy="420" r="4"  style="animation-delay:5.2s"/>
    </g>

    <!-- LOGO -->
    <g transform="translate(35 28) scale(0.6)">
      <g class="logo-float">
        <rect x="25" y="25" width="450" height="450" rx="90" fill="url(#bg)" stroke="#1e293b" stroke-width="8"/>
        <path d="M220 120 L280 120 M235 120 L235 170 L150 320 A40 40 0 0 0 185 380 L315 380 A40 40 0 0 0 350 320 L265 170 L265 120"
              fill="none" stroke="url(#flask)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M175 285 Q250 310 325 285 L338 315 A25 25 0 0 1 315 350 L185 350 A25 25 0 0 1 162 315 Z" fill="#10b981" opacity=".25"/>
        <path d="M100 250 L180 250 L205 285 L235 160 L265 330 L295 220 L315 250 L400 250"
              fill="none" stroke="url(#pulse)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" opacity=".38"/>
        <path class="logo-beam" pathLength="750" d="M100 250 L180 250 L205 285 L235 160 L265 330 L295 220 L315 250 L400 250"
              fill="none" stroke="url(#beam)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
        <circle class="node" cx="235" cy="160" r="10" fill="#38bdf8" style="animation-delay:.1s"/>
        <circle class="node" cx="265" cy="330" r="10" fill="#34d399" style="animation-delay:.25s"/>
      </g>
    </g>

    <!-- TEXT -->
    <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
      <g class="t1">
        <circle class="live" cx="392" cy="82" r="5" fill="#10b981"/>
        <text x="406" y="87" font-size="14" font-weight="700" letter-spacing="3" fill="#34d399">LIVE · IN-SILICO BIOASSAY LAB</text>
      </g>
      <g class="t1">
        <text x="388" y="175" font-size="78" font-weight="800" letter-spacing="2" fill="url(#title)">VIRTUPHARM</text>
        <text x="388" y="245" font-size="78" font-weight="800" letter-spacing="2" fill="#f8fafc">CORE</text>
        <line x1="388" y1="262" x2="760" y2="262" stroke="#1e293b" stroke-width="4" stroke-linecap="round"/>
        <line class="shimmer" pathLength="600" x1="388" y1="262" x2="760" y2="262" stroke="#34d399" stroke-width="4" stroke-linecap="round"/>
      </g>
      <g class="t2">
        <text x="388" y="300" font-size="19" fill="#cbd5e1">Precision In-Silico Pharmacology &amp; Deterministic</text>
        <text x="388" y="326" font-size="19" fill="#cbd5e1">Bioassay Simulation Engine</text>
      </g>
      <g class="t3" font-size="13" font-weight="700" letter-spacing="1.5">
        <rect x="388" y="344" width="132" height="26" rx="13" fill="#052e2b" stroke="#10b981"/>
        <text x="454" y="361" text-anchor="middle" fill="#34d399">ZERO ANIMALS</text>
        <rect x="530" y="344" width="132" height="26" rx="13" fill="#082f49" stroke="#38bdf8"/>
        <text x="596" y="361" text-anchor="middle" fill="#38bdf8">60 FPS DRUM</text>
        <rect x="672" y="344" width="172" height="26" rx="13" fill="#451a03" stroke="#f59e0b"/>
        <text x="758" y="361" text-anchor="middle" fill="#fbbf24">HILL · GADDUM · SCHILD</text>
      </g>
    </g>

    <!-- Banner-wide ECG -->
    <g transform="translate(0 227) scale(1 0.45)">
      <path vector-effect="non-scaling-stroke" pathLength="1000" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity=".28"
            d="M0 385 h60 l15 -15 l15 15 h15 l10 20 l15 -80 l15 105 l15 -45 h40
               h60 l15 -15 l15 15 h15 l10 20 l15 -80 l15 105 l15 -45 h40
               h60 l15 -15 l15 15 h15 l10 20 l15 -80 l15 105 l15 -45 h40
               h60 l15 -15 l15 15 h15 l10 20 l15 -80 l15 105 l15 -45 h40
               h60 l15 -15 l15 15 h15 l10 20 l15 -80 l15 105 l15 -45 h40
               h60 l15 -15 l15 15 h15 l10 20 l15 -80 l15 105 l15 -45 h40"/>
      <path vector-effect="non-scaling-stroke" class="ecg-beam" pathLength="1000" fill="none" stroke="#5eead4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"
            d="M0 385 h60 l15 -15 l15 15 h15 l10 20 l15 -80 l15 105 l15 -45 h40
               h60 l15 -15 l15 15 h15 l10 20 l15 -80 l15 105 l15 -45 h40
               h60 l15 -15 l15 15 h15 l10 20 l15 -80 l15 105 l15 -45 h40
               h60 l15 -15 l15 15 h15 l10 20 l15 -80 l15 105 l15 -45 h40
               h60 l15 -15 l15 15 h15 l10 20 l15 -80 l15 105 l15 -45 h40
               h60 l15 -15 l15 15 h15 l10 20 l15 -80 l15 105 l15 -45 h40"/>
    </g>
  </g>

  <rect x="2" y="2" width="1196" height="436" rx="27" fill="none" stroke="#1e293b" stroke-width="3"/>
</svg>
